<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Special Surprise 💐</title>

    <link rel="stylesheet" href="front.css">
</head>

<body>

    <main class="front-page">

        <div class="front-card">

            <div class="flowers">
                🌸 ✨ 🌸
            </div>

            <p class="small-title">
                A SPECIAL SURPRISE
            </p>

            <h1>
                For Our<br>
                Wonderful Teacher
            </h1>

            <div class="teacher-photo">

                <img
                    src="2fd78f66fd2c07fbdca51aae42cefd7a.jpg"
                    alt="Our Teacher"
                >

            </div>

            <p class="message">
                We prepared something special
                just for you. 💐
            </p>

            <a
                href="index (3).html"
                class="open-button"
            >
                Open 💌
            </a>

            <p class="footer-text">
                Made with appreciation by your students
            </p>

        </div>

    </main>

</body>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;

    min-height: 100vh;
    min-height: 100dvh;

    overflow: hidden;

    color: #4a3540;

    background:
        radial-gradient(
            circle at top left,
            rgba(255,255,255,0.9),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff0f5,
            #ffe4ec,
            #fff7df
        );
}


/* MAIN FRONT PAGE */

.front-page {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* CARD */

.front-card {
    width: min(90vw, 570px);

    padding:
        clamp(35px, 6vw, 60px)
        clamp(22px, 5vw, 50px);

    text-align: center;

    background: rgba(255, 255, 255, 0.9);

    border-radius: 30px;

    box-shadow:
        0 25px 65px
        rgba(100, 50, 70, 0.18);

    backdrop-filter: blur(12px);

    animation: appear 0.9s ease;
}


/* DECORATION */

.flowers {
    font-size: clamp(24px, 5vw, 34px);

    margin-bottom: 18px;

    animation:
        float
        3s
        ease-in-out
        infinite;
}


/* SMALL TITLE */

.small-title {
    font-size: clamp(10px, 2vw, 13px);

    letter-spacing: 3px;

    font-weight: bold;

    color: #b66a84;

    margin-bottom: 18px;
}


/* MAIN TITLE */

.front-card h1 {
    font-size: clamp(38px, 8vw, 62px);

    line-height: 0.98;

    color: #c94f7c;

    margin-bottom: 25px;

    text-shadow:
        0 3px 10px
        rgba(201, 79, 124, 0.12);
}


/* TEACHER PHOTO */

.teacher-photo {
    width: min(70vw, 360px);

    aspect-ratio: 16 / 10;

    margin: 0 auto 22px;

    overflow: hidden;

    border-radius: 20px;

    border: 5px solid white;

    box-shadow:
        0 10px 30px
        rgba(80, 40, 60, 0.2);

    animation:
        photoFloat
        4s
        ease-in-out
        infinite;
}

.teacher-photo img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* MESSAGE */

.message {
    font-size: clamp(14px, 2.5vw, 17px);

    line-height: 1.6;

    max-width: 380px;

    margin: 0 auto 25px;
}


/* OPEN BUTTON */

.open-button {
    display: inline-flex;

    justify-content: center;
    align-items: center;

    padding: 14px 30px;

    border-radius: 50px;

    background: #d85b86;

    color: white;

    text-decoration: none;

    font-size: clamp(14px, 2vw, 17px);

    font-weight: bold;

    box-shadow:
        0 10px 25px
        rgba(216, 91, 134, 0.35);

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.open-button:hover {
    transform: translateY(-4px);

    background: #c74774;
}

.open-button:active {
    transform: scale(0.94);
}


/* FOOTER */

.footer-text {
    margin-top: 25px;

    font-size: 11px;

    color: #987b87;
}


/* ANIMATIONS */

@keyframes appear {

    from {
        opacity: 0;

        transform:
            translateY(30px)
            scale(0.95);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}


@keyframes photoFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* PHONE */

@media (max-width: 600px) {

    .front-page {
        padding: 15px;
    }

    .front-card {
        width: 92vw;

        padding:
            32px
            18px
            35px;

        border-radius: 25px;
    }

    .teacher-photo {
        width: min(78vw, 320px);

        border-width: 4px;

        border-radius: 16px;
    }

    .front-card h1 {
        font-size: clamp(36px, 11vw, 50px);
    }

    .message {
        font-size: 14px;
    }

    .open-button {
        padding: 13px 27px;
    }
}
    
</style>
</html>
